site_name: LLM 后训练算法面试八股
site_description: 大模型后训练算法实习面试系统化复习资料 —— SFT / DPO / LoRA / RAG / Safety-RAG / vLLM
site_author: tcsnyy
repo_url: https://github.com/tcsnyy/llm-interview-notes
repo_name: tcsnyy/llm-interview-notes
edit_uri: ""

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - toc.integrate

plugins:
  - search:
      lang: zh
      separator: '[\s​\-、。，！？；：""''（）《》【】\[\]{}]+'

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - admonition
  - footnotes
  - toc:
      permalink: true
      toc_depth: 4
  - tables
  - attr_list
  - md_in_html

